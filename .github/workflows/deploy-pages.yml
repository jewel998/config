name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm --filter @jewel998/config-docs run build

      - name: Build portal
        env:
          VITE_FIREBASE_API_KEY: AIzaSyC-6lmMSwZ-Y51FufvI0I5ikxDbQTGJCNs
          VITE_FIREBASE_AUTH_DOMAIN: jewel998-config.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: jewel998-config
          VITE_FIREBASE_STORAGE_BUCKET: jewel998-config.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "851865994921"
          VITE_FIREBASE_APP_ID: "1:851865994921:web:8c0283c5de7f8d62cecbb8"
          VITE_FIREBASE_MEASUREMENT_ID: G-ND8MZ24EP0
        run: pnpm --filter @jewel998/config-portal run build

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r apps/docs/.vitepress/dist/* _site/
          cp -r apps/portal/dist _site/portal
          touch _site/.nojekyll
          cp _site/portal/index.html _site/portal/404.html
          cat > _site/404.html << 'HTMLEOF'
          <!doctype html>
          <html>
          <head><meta charset="utf-8"></head>
          <body>
          <script>
            var path = window.location.pathname;
            if (path.startsWith('/config/portal')) {
              window.location.replace('/config/portal/' + '?p=' + encodeURIComponent(path));
            }
          </script>
          </body>
          </html>
          HTMLEOF

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
